<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=512, initial-scale=1" />
    <title>Gen AI Meetup — organization logo</title>
    <style>
      @font-face { font-family: "DM Sans"; font-weight: 700; src: url("../fonts/dm-sans-bold.ttf") format("truetype"); }
      * { box-sizing: border-box; }
      html, body { width: 512px; height: 512px; margin: 0; }
      body { display: grid; place-items: center; background: #f6f3ec; color: #24231f; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; }
      .wordmark { display: inline-grid; grid-template-columns: auto auto; font-size: 145px; line-height: .85; letter-spacing: -9.54px; font-weight: 700; }
      .wordmark-dot { color: #b92358; }
      .wordmark-small { grid-column: 1 / -1; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 38.16px; line-height: 1; letter-spacing: 18.7px; margin-top: 38.16px; padding-left: 7.63px; }
    </style>
  </head>
  <body>
    <div class="wordmark" aria-label="Gen AI Meetup"><span>gen ai</span><span class="wordmark-dot">.</span><span class="wordmark-small">MEETUP</span></div>
  </body>
</html>
